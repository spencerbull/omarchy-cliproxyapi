name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test_display.cjs
  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: collector/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -buildmode=c-shared -o /tmp/omarchy-usage.so .
      - run: python3 test_abi.py /tmp/omarchy-usage.so
